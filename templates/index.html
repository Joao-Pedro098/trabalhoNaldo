<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Maps Clone - PyMaps (Padrão Naldo)</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Container do Mapa Fullscreen -->
    <div id="map"></div>

    <!-- Barra Estreita de Navegação Esquerda (Dock do Google Maps) -->
    <nav class="left-dock">
        <button class="dock-btn" title="Menu principal" id="btn-menu">
            <i class="fa-solid fa-bars"></i>
        </button>

        <div class="dock-main-actions">
            <button class="dock-btn active" title="Pesquisar e Rotas" id="btn-dock-routes">
                <div class="dock-icon-circle">
                    <i class="fa-solid fa-diamond-turn-right"></i>
                </div>
                <span>Rotas</span>
            </button>
            <button class="dock-btn" title="Lugares Salvos" id="btn-dock-saved">
                <i class="fa-regular fa-bookmark"></i>
                <span>Salvos</span>
            </button>
            <button class="dock-btn" title="Rotas Recentes / Histórico" id="btn-dock-history">
                <i class="fa-solid fa-clock-rotate-left"></i>
                <span>Recentes</span>
            </button>
        </div>

        <div class="dock-bottom-actions">
            <button class="dock-btn" title="Baixar aplicativo">
                <i class="fa-solid fa-mobile-screen"></i>
            </button>
        </div>
    </nav>

    <!-- Painel Principal de Rotas Estilo Google Maps -->
    <aside class="maps-panel" id="maps-panel">
        
        <!-- Barra Superior de Modos de Transporte (Carro, Moto, Transporte, A pé, Bicicleta) -->
        <div class="mode-selector">
            <button class="mode-tab active" data-mode="melhor" title="Melhor rota">
                <i class="fa-solid fa-diamond-turn-right"></i>
                <span class="mode-label">Melhor</span>
            </button>
            <button class="mode-tab" data-mode="carro" title="Carro">
                <i class="fa-solid fa-car"></i>
                <span class="mode-badge" id="badge-carro">--</span>
            </button>
            <button class="mode-tab" data-mode="moto" title="Moto">
                <i class="fa-solid fa-motorcycle"></i>
                <span class="mode-badge" id="badge-moto">--</span>
            </button>
            <button class="mode-tab" data-mode="transporte" title="Transporte público">
                <i class="fa-solid fa-bus-simple"></i>
                <span class="mode-badge" id="badge-transporte">--</span>
            </button>
            <button class="mode-tab" data-mode="a_pe" title="A pé">
                <i class="fa-solid fa-person-walking"></i>
                <span class="mode-badge" id="badge-a_pe">--</span>
            </button>
            <button class="mode-tab" data-mode="bicicleta" title="Bicicleta">
                <i class="fa-solid fa-person-biking"></i>
                <span class="mode-badge" id="badge-bicicleta">--</span>
            </button>
            <button class="mode-close-btn" id="btn-clear-all" title="Fechar rota">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- Grupo de Inputs Origem e Destino com Conector -->
        <div class="routing-inputs-box">
            <div class="inputs-symbols">
                <span class="circle-point">○</span>
                <span class="dots-connector">⋮</span>
                <span class="pin-point"><i class="fa-solid fa-location-dot"></i></span>
            </div>

            <div class="inputs-fields">
                <!-- Origem -->
                <div class="input-container">
                    <input type="text" id="origin-input" placeholder="Escolha o ponto de partida ou clique no mapa" autocomplete="off">
                    <button class="input-action-btn" id="btn-my-location" title="Usar minha localização">
                        <i class="fa-solid fa-crosshairs"></i>
                    </button>
                    <div id="origin-suggestions" class="suggestions-dropdown hidden"></div>
                </div>

                <!-- Destino -->
                <div class="input-container">
                    <input type="text" id="dest-input" placeholder="Escolha o destino ou clique no mapa" autocomplete="off">
                    <button class="input-action-btn" id="btn-search-dest" title="Buscar">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                    <div id="dest-suggestions" class="suggestions-dropdown hidden"></div>
                </div>
            </div>

            <!-- Botão de Inverter Pontos -->
            <button class="btn-swap-points" id="btn-swap" title="Inverter partida e destino">
                <i class="fa-solid fa-arrow-down-up-across-line"></i>
            </button>
        </div>

        <!-- Linha de Ações: Adicionar Destino e Horário -->
        <div class="routing-subactions">
            <button class="subaction-btn" id="btn-add-destination" title="Adicionar parada intermediária">
                <i class="fa-solid fa-circle-plus"></i> Adicionar destino
            </button>
            <div class="subaction-right">
                <span class="depart-time"><i class="fa-regular fa-clock"></i> Sair agora <i class="fa-solid fa-caret-down"></i></span>
                <span class="options-link">Opções</span>
            </div>
        </div>

        <!-- Alerta de Notificações / Erros -->
        <div id="alert-box" class="alert hidden"></div>

        <!-- Barra de Ações Rápidas (Smartphone / Copiar Link) -->
        <div class="quick-share-bar hidden" id="quick-share-bar">
            <button class="share-link-btn" id="btn-share-phone">
                <i class="fa-solid fa-mobile-screen-button"></i> Enviar rotas para seu smartphone
            </button>
            <button class="share-link-btn" id="btn-copy-link">
                <i class="fa-solid fa-link"></i> Copiar link
            </button>
        </div>

        <!-- Lista de Rotas Alternativas Calculadas (Exatamente igual ao Google Maps) -->
        <div class="routes-container hidden" id="routes-container">
            <div class="routes-list" id="routes-list">
                <!-- Inserido dinamicamente via JS -->
            </div>
        </div>

        <!-- Drawer de Detalhes Passo a Passo (Turn-by-turn) -->
        <div class="steps-drawer hidden" id="steps-drawer">
            <div class="steps-drawer-header">
                <button class="btn-back-to-routes" id="btn-back-to-routes" title="Voltar para opções de rotas">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <div class="steps-drawer-title">
                    <h4 id="drawer-route-title">via Rua Principal</h4>
                    <span id="drawer-route-meta">-- min (-- km)</span>
                </div>
            </div>
            <div class="steps-drawer-body" id="steps-drawer-body">
                <!-- Passos inseridos via JS -->
            </div>
        </div>

        <!-- Painel de Histórico (Recentes) -->
        <div class="history-drawer hidden" id="history-drawer">
            <div class="history-drawer-header">
                <h3><i class="fa-solid fa-clock-rotate-left"></i> Rotas Recentes</h3>
                <button class="btn-clear-db" id="btn-clear-history-db">Limpar Tudo</button>
            </div>
            <div class="history-drawer-body" id="history-drawer-body">
                <p class="empty-state">Nenhuma rota calculada ainda.</p>
            </div>
        </div>

        <!-- Alça / Botão de Recolher e Expandir no Mobile -->
        <div class="mobile-toggle-bar" id="mobile-toggle-btn">
            <span class="mobile-handle-pill"></span>
            <span class="mobile-toggle-text" id="mobile-toggle-text"><i class="fa-solid fa-chevron-up"></i> Recolher para ver o mapa</span>
        </div>

    </aside>

    <!-- Botões Flutuantes sobre o Mapa (Estilo Google Maps) -->
    <div class="map-floating-controls">
        <button class="fab-location" id="fab-my-location" title="Sua localização atual">
            <i class="fa-solid fa-crosshairs"></i>
        </button>
        <button class="fab-open-panel hidden" id="fab-open-panel">
            <i class="fa-solid fa-route"></i> Ver Rotas
        </button>
    </div>

    <!-- Menu de Contexto do Botão Direito no Mapa -->
    <div id="context-menu" class="context-menu hidden">
        <button id="ctx-set-origin">
            <i class="fa-solid fa-circle-dot origin-color"></i> Partir deste local
        </button>
        <button id="ctx-set-dest">
            <i class="fa-solid fa-location-dot dest-color"></i> Ir até este local
        </button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Custom Map JS -->
    <script src="{{ url_for('static', filename='js/map.js') }}"></script>
</body>
</html>
