<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyMaps - Mini Google Maps em Python</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Container do Mapa Fullscreen -->
    <div id="map"></div>

    <!-- Painel Lateral Estilo Google Maps -->
    <aside class="sidebar" id="sidebar">
        <!-- Cabeçalho do App -->
        <div class="sidebar-header">
            <div class="brand">
                <i class="fa-solid fa-map-location-dot brand-icon"></i>
                <span class="brand-title">PyMaps</span>
                <span class="badge">Naldo MVC</span>
            </div>
            <div class="header-actions">
                <button id="btn-toggle-history" title="Ver Histórico de Rotas" class="icon-btn">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                </button>
            </div>
        </div>

        <!-- Painel de Formulário de Rota -->
        <div class="route-panel">
            <div class="inputs-group">
                <!-- Origem -->
                <div class="input-row">
                    <div class="input-icon origin-icon">
                        <i class="fa-solid fa-circle-dot"></i>
                    </div>
                    <div class="input-wrapper">
                        <input type="text" id="origin-input" placeholder="Ponto de partida (A) ou clique no mapa" autocomplete="off">
                        <div id="origin-suggestions" class="suggestions-dropdown hidden"></div>
                    </div>
                    <button id="btn-my-location" class="location-btn" title="Usar minha localização atual">
                        <i class="fa-solid fa-crosshairs"></i>
                    </button>
                </div>

                <!-- Botão de Inverter Pontos -->
                <div class="swap-row">
                    <div class="swap-connector"></div>
                    <button id="btn-swap-locations" class="swap-btn" title="Inverter origem e destino">
                        <i class="fa-solid fa-arrow-down-up-across-line"></i>
                    </button>
                </div>

                <!-- Destino -->
                <div class="input-row">
                    <div class="input-icon dest-icon">
                        <i class="fa-solid fa-location-dot"></i>
                    </div>
                    <div class="input-wrapper">
                        <input type="text" id="dest-input" placeholder="Destino (B) ou clique no mapa" autocomplete="off">
                        <div id="dest-suggestions" class="suggestions-dropdown hidden"></div>
                    </div>
                </div>
            </div>

            <!-- Botões de Ação -->
            <div class="action-buttons">
                <button id="btn-calculate-route" class="btn btn-primary">
                    <i class="fa-solid fa-route"></i> Traçar Rota
                </button>
                <button id="btn-clear-route" class="btn btn-secondary" title="Limpar rota e marcadores">
                    <i class="fa-solid fa-trash-can"></i> Limpar
                </button>
            </div>
        </div>

        <!-- Alerta de Notificação / Erros -->
        <div id="alert-box" class="alert hidden"></div>

        <!-- Card de Resumo da Rota -->
        <div id="route-summary" class="route-summary hidden">
            <div class="summary-header">
                <div class="summary-mode">
                    <i class="fa-solid fa-car"></i> Carro (OSRM)
                </div>
                <div class="summary-time" id="summary-time">-- min</div>
            </div>
            <div class="summary-details">
                <span class="summary-distance" id="summary-distance">-- km</span>
                <span class="summary-traffic">Trânsito em tempo normal</span>
            </div>

            <!-- Botão expansor das instruções passo a passo -->
            <button id="btn-toggle-steps" class="btn-toggle-steps">
                <span>Instruções detalhadas do percurso</span>
                <i class="fa-solid fa-chevron-down" id="steps-chevron"></i>
            </button>

            <!-- Lista passo a passo (turn-by-turn) -->
            <div id="steps-list" class="steps-list hidden"></div>
        </div>

        <!-- Painel de Histórico (gaveta) -->
        <div id="history-panel" class="history-panel hidden">
            <div class="history-header">
                <h3><i class="fa-solid fa-history"></i> Histórico Recente</h3>
                <button id="btn-clear-history-db" class="btn-text-danger" title="Apagar histórico">
                    <i class="fa-solid fa-trash-arrow-up"></i> Limpar Tudo
                </button>
            </div>
            <div id="history-items" class="history-items">
                <p class="empty-state">Nenhuma rota calculada ainda.</p>
            </div>
        </div>
    </aside>

    <!-- Menu de Contexto do Botão Direito no Mapa -->
    <div id="context-menu" class="context-menu hidden">
        <button id="ctx-set-origin">
            <i class="fa-solid fa-circle-dot origin-color"></i> Partir deste local
        </button>
        <button id="ctx-set-dest">
            <i class="fa-solid fa-location-dot dest-color"></i> Ir até este local
        </button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Custom Map JS -->
    <script src="{{ url_for('static', filename='js/map.js') }}"></script>
</body>
</html>
